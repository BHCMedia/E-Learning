<div class="card" data-card-id="card-02">
  <style>
    .card[data-card-id="card-02"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      background: var(--bg);
      display: flex;
      align-items: center;
      padding: 48px 72px;
      gap: 48px;
      color: var(--text);
      font-family: "Inter", ui-serif, serif;
    }
    .card[data-card-id="card-02"] .text-col {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card[data-card-id="card-02"] .kicker {
      align-self: flex-start;
      padding: 9px 20px;
      background: var(--accent-0);
      color: #fff;
      font: 700 17px/1 "Inter", sans-serif;
      letter-spacing: 0.2em;
      border-radius: 4px;
    }
    .card[data-card-id="card-02"] .title {
      margin: 0;
      font: 800 58px/1.1 "Inter", ui-serif, serif;
      color: var(--text);
      max-width: 95%;
    }
    .card[data-card-id="card-02"] .rule {
      width: 0;
      height: 5px;
      background: var(--accent-0);
      border-radius: 3px;
    }
    .card[data-card-id="card-02"] .detail {
      margin: 0;
      font: 30px/1.45 ui-serif, serif;
      color: var(--text);
      opacity: 0.82;
      max-width: 92%;
    }
    .card[data-card-id="card-02"] .side {
      flex: 0 0 340px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .card[data-card-id="card-02"] .side-ring {
      width: 220px;
      height: 220px;
      border: 10px solid var(--accent-0);
      border-radius: 50%;
      opacity: 0.28;
    }
    .card[data-card-id="card-02"] .side-glass {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-2);
      opacity: 0.85;
    }
  </style>

  <div class="root">
    <div class="text-col">
      <span class="kicker" data-anim="fade-in" data-anim-at="0.1" data-anim-duration="0.35">WHY IT MATTERS</span>
      <h2 id="card-02-title" class="title" data-anim="slide-in" data-anim-at="0.3" data-anim-duration="0.5" data-anim-from="bottom" data-anim-distance="40">Spotting who's at risk, early</h2>
      <div id="card-02-rule" class="rule" data-anim="grow-x" data-anim-at="0.75" data-anim-duration="0.45" data-anim-target-w="110"></div>
      <p class="detail" data-anim="fade-in" data-anim-at="0.9" data-anim-duration="0.45">Identifying older adults at risk is one of the most important things we can do to prevent abuse before it starts.</p>
    </div>
    <div class="side">
      <span class="side-ring" data-anim="scale-pop" data-anim-at="0.2" data-anim-duration="0.55"></span>
      <span class="side-glass" data-anim="fade-in" data-anim-at="0.5" data-anim-duration="0.4"></span>
    </div>
  </div>
</div>
