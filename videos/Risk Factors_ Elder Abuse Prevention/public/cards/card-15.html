<div class="card" data-card-id="card-15">
  <style>
    .card[data-card-id="card-15"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 220px;
      gap: 22px;
      color: var(--text);
      font-family: "Inter", ui-serif, serif;
      text-align: center;
    }
    .card[data-card-id="card-15"] .kicker {
      padding: 12px 24px;
      background: var(--accent-2);
      color: #fff;
      font: 700 20px/1 "Inter", sans-serif;
      letter-spacing: 0.22em;
      border-radius: 4px;
    }
    .card[data-card-id="card-15"] .title {
      margin: 0;
      font: 800 76px/1.1 "Inter", ui-serif, serif;
      color: var(--text);
    }
    .card[data-card-id="card-15"] .detail {
      margin: 0;
      font: italic 400 38px/1.3 ui-serif, serif;
      color: var(--accent-2);
    }
    .card[data-card-id="card-15"] .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 760px;
      height: 760px;
      border: 3px solid var(--accent-0);
      border-radius: 50%;
      opacity: 0.14;
    }
  </style>

  <div class="root">
    <span class="ring" data-anim="scale-pop" data-anim-at="0.05" data-anim-duration="0.7"></span>
    <span class="kicker" data-anim="fade-in" data-anim-at="0.1" data-anim-duration="0.4">THANK YOU</span>
    <h1 id="card-15-title" class="title" data-anim="slide-in" data-anim-at="0.35" data-anim-duration="0.5" data-anim-from="bottom" data-anim-distance="30">Thank you for your commitment</h1>
    <p class="detail" data-anim="fade-in" data-anim-at="0.85" data-anim-duration="0.5">to safety and respect.</p>
  </div>
</div>
