<div class="card" data-card-id="card-14">
  <style>
    .card[data-card-id="card-14"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      background: var(--bg);
      display: flex;
      align-items: center;
      padding: 40px 72px;
      gap: 56px;
      color: var(--text);
      font-family: "Inter", ui-serif, serif;
    }
    .card[data-card-id="card-14"] .numblock {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .card[data-card-id="card-14"] .num {
      font: 800 168px/1 "Inter", sans-serif;
      color: var(--accent-0);
    }
    .card[data-card-id="card-14"] .numlabel {
      font: 700 18px/1.2 "Inter", sans-serif;
      letter-spacing: 0.18em;
      color: var(--accent-0);
      text-align: center;
      opacity: 0.85;
    }
    .card[data-card-id="card-14"] .text-col {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card[data-card-id="card-14"] .kicker {
      align-self: flex-start;
      padding: 9px 20px;
      background: var(--accent-0);
      color: #fff;
      font: 700 17px/1 "Inter", sans-serif;
      letter-spacing: 0.2em;
      border-radius: 4px;
    }
    .card[data-card-id="card-14"] .title {
      margin: 0;
      font: 800 52px/1.15 "Inter", ui-serif, serif;
      color: var(--text);
      max-width: 95%;
    }
    .card[data-card-id="card-14"] .cats {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }
    .card[data-card-id="card-14"] .cat {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 600 22px/1 "Inter", sans-serif;
      opacity: 0.85;
    }
    .card[data-card-id="card-14"] .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }
    .card[data-card-id="card-14"] .dot-0 { background: var(--accent-0); }
    .card[data-card-id="card-14"] .dot-2 { background: var(--accent-2); }
    .card[data-card-id="card-14"] .dot-3 { background: var(--accent-3); }
    .card[data-card-id="card-14"] .dot-4 { background: var(--accent-4); }
  </style>

  <div class="root">
    <div class="numblock">
      <span id="card-14-num" class="num" data-anim="count-up" data-anim-at="0.2" data-anim-duration="0.9" data-anim-from="0" data-anim-to="4" data-anim-format=",d">0</span>
      <span class="numlabel" data-anim="fade-in" data-anim-at="0.9" data-anim-duration="0.4">RISK CATEGORIES</span>
    </div>
    <div class="text-col">
      <span class="kicker" data-anim="fade-in" data-anim-at="0.05" data-anim-duration="0.35">THE TAKEAWAY</span>
      <h2 id="card-14-title" class="title" data-anim="slide-in" data-anim-at="0.25" data-anim-duration="0.5" data-anim-from="bottom" data-anim-distance="36">4 categories. One goal: prevention.</h2>
      <div class="cats" data-anim="fade-in" data-anim-at="1.1" data-anim-duration="0.45">
        <span class="cat"><span class="dot dot-0"></span>Personal</span>
        <span class="cat"><span class="dot dot-2"></span>Relationship</span>
        <span class="cat"><span class="dot dot-3"></span>Social</span>
        <span class="cat"><span class="dot dot-4"></span>Organizational</span>
      </div>
    </div>
  </div>
</div>
