<!doctype html>

    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }

      :root {
        --indigo: #1a1a4d;
        --cyan: #00e5ff;
        --white: #f5f7ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .video-wrapper {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-host {
        position: absolute;
        pointer-events: none;
        overflow: hidden;
      }
      .card-host .card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const FPS = 25;
          const q = (t) => Math.round(t * FPS) / FPS;
          const EASE = "power2.out";
          const EASE_IO = "power2.inOut";

          const tl = window.gsap.timeline({ paused: true });

          function enter(cardId, t, dur) {
            tl.set('.card-host[data-card-id="' + cardId + '"]', { visibility: "visible" }, q(t));
            tl.fromTo(
              '.card-host[data-card-id="' + cardId + '"]',
              { opacity: 0 },
              { opacity: 1, duration: dur, ease: EASE },
              q(t),
            );
          }
          function exit(cardId, t, dur) {
            tl.to(
              '.card-host[data-card-id="' + cardId + '"]',
              { opacity: 0, duration: dur, ease: "power2.in" },
              q(t - dur),
            );
            tl.set('.card-host[data-card-id="' + cardId + '"]', { visibility: "hidden" }, q(t));
          }
          function growX(sel, t, dur, targetW) {
            tl.fromTo(sel, { width: 0 }, { width: targetW, duration: dur, ease: EASE }, q(t));
          }
          function fadeIn(sel, t, dur, extraFrom, extraTo) {
            tl.fromTo(
              sel,
              Object.assign({ opacity: 0 }, extraFrom || {}),
              Object.assign({ opacity: 1, duration: dur, ease: EASE }, extraTo || {}),
              q(t),
            );
          }

          // The source video sits permanently full-screen and fully visible
          // (never tweened — GSAP-animating left/top/width/height on a layout
          // box snaps to integer device pixels and stutters under seek-by-frame
          // capture). Instead, every "hide the narrator" or "split-screen" moment
          // is achieved purely by an opaque indigo card-host covering the portion
          // of the canvas that should not show her — the video underneath is
          // simply never drawn there. Her visible portion is therefore always
          // literally untouched pixels from the source, never cropped/moved.

          // ============================================================
          // 0.00 -> 5.00  Title card (video fully covered by the opaque card; audio already playing)
          // ============================================================
          enter("card-01-title", 0.0, 0.5);
          // fade-up + slight scale-in (1.05 -> 1.0), no bounce
          tl.fromTo(
            "#card-01-content",
            { opacity: 0, y: 26, scale: 1.05 },
            { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: EASE },
            q(0.15),
          );
          growX("#card-01-underline", 1.05, 0.6, 560);
          exit("card-01-title", 5.0, 0.4);

          // ============================================================
          // 5.00 -> 46.08  Narrator full-screen, untouched (opening)
          // (no card-host active — video shows through everywhere)
          // ============================================================

          // ============================================================
          // 46.08 -> 64.58  Alzheimer's — full-screen graphic (icon scales from centre)
          // ============================================================
          enter("card-02-alzheimers", 46.08, 0.4);
          fadeIn("#card-02-icon", 46.18, 0.7, { scale: 0.6 }, { scale: 1 });
          fadeIn("#card-02-name", 46.63, 0.5);
          growX("#card-02-underline", 47.03, 0.5, 420);
          exit("card-02-alzheimers", 64.58, 0.4);

          // ============================================================
          // 64.58 -> 72.28  Vascular — split-screen, narrator LEFT / graphic RIGHT
          // (card-03's host is positioned over the right half only — see its
          // style="left:960px;width:960px" below — so her left half is untouched)
          // ============================================================
          enter("card-03-vascular", 64.58, 0.4);
          // slide in from the outer (right) edge, ease-out only
          fadeIn("#card-03-group", 64.68, 0.65, { x: 70 }, { x: 0 });
          growX("#card-03-underline", 65.23, 0.45, 300);
          exit("card-03-vascular", 72.28, 0.4);

          // ============================================================
          // 72.28 -> 83.42  Lewy Body — full-screen graphic (icon drops from top)
          // ============================================================
          enter("card-04-lewybody", 72.28, 0.4);
          fadeIn("#card-04-icon", 72.38, 0.65, { y: -60 }, { y: 0 });
          fadeIn("#card-04-name", 72.93, 0.5);
          growX("#card-04-underline", 73.33, 0.5, 420);
          exit("card-04-lewybody", 83.42, 0.4);

          // ============================================================
          // 83.42 -> 93.42  Frontotemporal — split-screen, narrator RIGHT / graphic LEFT
          // (card-05's host covers the left half only — style="left:0;width:960px" —
          // so her right half is untouched)
          // ============================================================
          enter("card-05-frontotemporal", 83.42, 0.4);
          // slide in from the outer (left) edge, ease-out only
          fadeIn("#card-05-group", 83.52, 0.65, { x: -70 }, { x: 0 });
          growX("#card-05-underline", 84.07, 0.45, 340);
          exit("card-05-frontotemporal", 93.42, 0.4);

          // ============================================================
          // 93.42 -> 103.00  Mixed — full-screen graphic, two icons crossfade/overlap
          // ============================================================
          enter("card-06-mixed", 93.42, 0.4);
          fadeIn("#card-06-icon-a", 93.52, 0.7, { scale: 0.85 }, { scale: 1 });
          fadeIn("#card-06-icon-b", 93.87, 0.7, { scale: 0.85 }, { scale: 1 });
          fadeIn("#card-06-name", 94.27, 0.5);
          growX("#card-06-underline", 94.62, 0.5, 360);
          exit("card-06-mixed", 103.0, 0.4);

          // ============================================================
          // 103.00 -> 151.00  Narrator full-screen, untouched (advice + wrap-up tail)
          // (no card-host active — video shows through everywhere)
          // ============================================================

          window.__timelines = window.__timelines || {};
          window.__timelines["chapter-2-what-is-dementia"] = tl;
        })();
      </script>
